# Nombre de la aplicación que aparece en los registros de Spring Boot.
spring.application.name=p6springboot

# Indica dónde buscar los archivos messages.properties y sus variantes por idioma.
spring.messages.basename=messages

# Los archivos de mensajes se guardan en UTF-8 para admitir tildes y otros caracteres.
spring.messages.encoding=UTF-8

# Si falta un idioma concreto, no se depende del idioma configurado en el ordenador.
spring.messages.fallback-to-system-locale=false
