# Nombre identificativo de la aplicación Spring Boot.
spring.application.name=P1SpringBoot

# EJEMPLO DE CONFIGURACIÓN (inactivo) PARA MySQL + Spring Data JPA.
# Este bloque solo tendrá efecto cuando se añadan/activen en pom.xml
# spring-boot-starter-data-jpa y el driver com.mysql:mysql-connector-j.
# Sustituye los valores de ejemplo por los de tu propia base de datos.
#
# Dirección JDBC: localhost y 3306 son los valores habituales de MySQL.
# spring.datasource.url=jdbc:mysql://localhost:3306/nombre_de_la_base
#
# Usuario y contraseña de la base de datos. No guardes credenciales reales
# en el repositorio: en un entorno real, usa variables de entorno o secretos.
# spring.datasource.username=usuario
# spring.datasource.password=CAMBIAR_ESTA_CONTRASENA
#
# Driver JDBC de MySQL. Spring Boot suele detectarlo automáticamente,
# pero se muestra explícitamente para que el ejemplo sea más didáctico.
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# ALTERNATIVA PARA MariaDB: usa el driver org.mariadb.jdbc:mariadb-java-client
# en pom.xml en lugar del driver de MySQL y descomenta estas propiedades
# (mantén comentadas las propiedades JDBC y driver de MySQL de arriba).
# spring.datasource.url=jdbc:mariadb://localhost:3306/nombre_de_la_base
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#
# Indica a Hibernate cómo gestionar el esquema. "update" puede ser útil
# durante el desarrollo; en producción se recomienda gestionar cambios
# del esquema con migraciones (por ejemplo, Flyway o Liquibase).
# spring.jpa.hibernate.ddl-auto=update
#
# Muestra las consultas SQL en los registros, útil al aprender o depurar.
# spring.jpa.show-sql=true
