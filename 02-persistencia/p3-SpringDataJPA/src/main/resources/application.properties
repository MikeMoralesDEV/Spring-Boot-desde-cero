spring.application.name=p3-spring-data-jpa

# MariaDB debe estar instalado y ejecutándose antes de iniciar la aplicación.
# DB_URL, DB_USERNAME y DB_PASSWORD pueden sobrescribirse mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tienda_videojuegos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# En esta práctica, update permite crear la tabla y conservar los juegos entre reinicios.
# Es una comodidad de aprendizaje, no una estrategia de migración para producción.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
