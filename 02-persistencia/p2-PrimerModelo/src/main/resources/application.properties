# Nombre visible en los registros de Spring Boot.
spring.application.name=p2-PrimerModelo

# Spring Boot configura la conexión a H2, que crea una base local en archivos.
spring.datasource.url=jdbc:h2:file:./data/p2-primer-modelo
spring.datasource.username=sa
spring.datasource.password=

# Hibernate vuelve a crear las tablas mapeadas al arrancar; puede borrar datos.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
