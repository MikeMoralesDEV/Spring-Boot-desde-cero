spring.application.name=u4p2-apartado2

# Base local exclusiva para esta práctica.
spring.datasource.url=jdbc:h2:file:./data/u4p2-apartado2
spring.datasource.username=sa
spring.datasource.password=

# El proyecto ejecuta el SQL entregado antes de que Hibernate valide el modelo.
spring.sql.init.mode=always

# Completa el modo de Hibernate según el apartado 2.
spring.jpa.hibernate.ddl-auto=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
