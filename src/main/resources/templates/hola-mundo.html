<!DOCTYPE html>
<!--
    Plantilla HTML de bienvenida, procesada por Thymeleaf.
    El controlador HelloController la selecciona devolviendo "hola-mundo".
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que la página se adapte correctamente a pantallas pequeñas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hola, mundo</title>
</head>
<body>
    <main>
        <h1>¡Hola, mundo!</h1>
        <p>Esta página HTML ha sido devuelta por un controlador de Spring MVC.</p>
    </main>
</body>
</html>
